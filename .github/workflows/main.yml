name: iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Source
        run: |
          unzip Room_Dairy_Manager_Android_Source.zip -d source

      - name: Fix Dependencies
        run: |
          cd source/dairypro_android_project

          npm pkg set 'devDependencies.typescript=5.9.3'
          npm pkg set 'devDependencies.esbuild=0.28.2'
          npm pkg set 'devDependencies.@capacitor/cli=7.4.3'
          npm pkg set 'dependencies.@capacitor/core=7.4.3'

          npm install --legacy-peer-deps

      - name: Install Capacitor iOS
        run: |
          cd source/dairypro_android_project
          npm install @capacitor/ios@7.4.3 --legacy-peer-deps

      - name: Build Web App
        run: |
          cd source/dairypro_android_project
          npm run build

      - name: Add iOS Platform
        run: |
          cd source/dairypro_android_project
          npx cap add ios

      - name: Sync iOS
        run: |
          cd source/dairypro_android_project
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd source/dairypro_android_project/ios/App
          pod install

      - name: Build iOS App
        run: |
          cd source/dairypro_android_project/ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            source/dairypro_android_project/build/Build/Products/Release-iphoneos/App.app \
            Payload/

          zip -r Room-Dairy-Manager.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Room-Dairy-Manager-IPA
          path: Room-Dairy-Manager.ipa
          if-no-files-found: error
