name: Dairy Manager APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract Project
        run: |
          unzip -q Room_Dairy_Manager_Android_Source.zip -d source
          find source -name package.json

      - name: Build APK
        run: |
          cd source/dairypro_android_project
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dairy-Manager-APK
          path: source/dairypro_android_project/android/app/build/outputs/apk/debug/app-debug.apk
