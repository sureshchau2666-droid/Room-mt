name: Dairy Manager APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install Android SDK Packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Extract ZIP
      - name: Extract Project ZIP
        run: |
          unzip -q Room_Dairy_Manager_Android_Source.zip -d source

      # 7. Find Project Folder
      - name: Find Project Folder
        shell: bash
        run: |
          PACKAGE_FILE=$(find source \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project folder: $PROJECT_DIR"

      # 8. Fix Dependency Version
      - name: Fix Dependency Version
        run: |
          cd "$PROJECT_DIR"

          npm pkg set 'devDependencies.esbuild=^0.28.2'

          npm install --no-audit --no-fund

      # 9. Build Web App
      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      # 10. Setup Capacitor Android
      - name: Setup Capacitor Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      # 11. Build APK
      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dairy-Manager-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
