name: iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Source
        run: |
          unzip Room_Dairy_Manager_Android_Source.zip -d source

      - name: Install Dependencies
        run: |
          cd source/dairypro_android_project
          npm install

      - name: Add iOS Platform
        run: |
          cd source/dairypro_android_project
          npm install @capacitor/ios
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App
        run: |
          cd source/dairypro_android_project
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R source/dairypro_android_project/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Room-Dairy-Manager.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Room-Dairy-Manager-IPA
          path: Room-Dairy-Manager.ipa
