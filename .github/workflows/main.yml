name: Dairy Manager APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract Project
        run: |
          unzip -q Room_Dairy_Manager_Android_Source.zip -d source

      - name: Find Project Folder
        run: |
          PROJECT_DIR=$(dirname "$(find source -name package.json -not -path '*/node_modules/*' -print -quit)")
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix esbuild Version
        run: |
          cd "$PROJECT_DIR"
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          npm install

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Setup Capacitor
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dairy-Manager-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
